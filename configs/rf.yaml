random_seed: 42
test_size: 0.2

paths:
  model_dir: models
  model_file: models/model.pkl
  scaler_file: models/scaler.pkl

features:
  log_transform:
    - CRIM
    - LSTAT
    - DIS
  poly_features:
    - RM
    - LSTAT
  poly_degree: 2
  drop:
    - B
  interactions:
    - [RM, LSTAT]

model:
  type: rf
  rf_n_estimators: 400
  rf_max_depth: 12
